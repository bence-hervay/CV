<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bence Hervay — CV</title>
<meta name="description" content="Curriculum vitae of Bence Hervay.">
<style>
  :root { color-scheme: light dark; --fg:#111; --bg:#fafafa; --card:#fff; --line:#e3e3e3; --accent:#1a1a1a; }
  @media (prefers-color-scheme: dark) {
    :root { --fg:#eee; --bg:#121212; --card:#1c1c1c; --line:#2e2e2e; --accent:#eee; }
  }
  * { box-sizing: border-box; }
  body { margin:0; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         color: var(--fg); background: var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:1rem; align-items:center; justify-content:space-between;
           padding: 1.1rem 1.25rem; border-bottom:1px solid var(--line); background: var(--card); }
  h1 { font-size: 1.15rem; margin:0; font-weight:600; letter-spacing:-0.01em; }
  .sub { font-size:.85rem; opacity:.6; margin-top:.15rem; }
  a.btn { display:inline-block; text-decoration:none; border:1px solid var(--accent); color:var(--accent);
          padding:.5rem .9rem; border-radius:8px; font-size:.9rem; font-weight:500; }
  a.btn:hover { background: var(--accent); color: var(--card); }
  main { padding: 1.25rem; max-width: 1100px; margin: 0 auto; }
  .viewer { width:100%; height: 80vh; min-height: 460px; border:1px solid var(--line); border-radius:10px;
            background: var(--card); }
  .fallback { padding:1rem 0; font-size:.95rem; opacity:.75; }
  footer { padding: 1rem 1.25rem 2rem; text-align:center; font-size:.8rem; opacity:.5; }
</style>
</head>
<body>
<header>
  <div>
    <h1>Bence Hervay — Curriculum Vitae</h1>
    <div class="sub">cv.bence.io</div>
  </div>
  <a class="btn" href="Bence_Hervay_CV.pdf" download>Download PDF</a>
</header>
<main>
  <!-- <object> degrades to its children when the browser cannot render a PDF
       inline, which is most mobile browsers — so the fallback is a real link
       rather than a blank grey rectangle. -->
  <object class="viewer" data="Bence_Hervay_CV.pdf" type="application/pdf">
    <div class="fallback">
      Your browser can't show the PDF inline.
      <a href="Bence_Hervay_CV.pdf">Open it directly</a>.
    </div>
  </object>
</main>
<footer>Last updated February 2026</footer>
</body>
</html>
